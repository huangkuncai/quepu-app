// Optional build accelerator for networks where Google's Maven repository is slow.
// Keep the official repositories as fallbacks; this script only puts mirrors first.

def addMirrors = { repositories ->
    repositories.maven { url = uri('https://storage.flutter-io.cn/download.flutter.io') }
    repositories.maven { url = uri('https://maven.aliyun.com/repository/google') }
    repositories.maven { url = uri('https://maven.aliyun.com/repository/public') }
    repositories.maven { url = uri('https://maven.aliyun.com/repository/gradle-plugin') }
}

beforeSettings { settings ->
    addMirrors(settings.pluginManagement.repositories)
    addMirrors(settings.dependencyResolutionManagement.repositories)
}

gradle.beforeProject { project ->
    addMirrors(project.buildscript.repositories)
}
